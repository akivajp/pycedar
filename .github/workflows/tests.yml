name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest validates that the vendored cedar C++ sources build
        # under MSVC; wheels for it are produced by the release workflow.
        # (windows-latest は vendored cedar の C++ ソースが MSVC でビルド
        #  できることを検証する。wheel は release ワークフローが生成する)
        # windows-11-arm additionally validates the MSVC ARM64 build on the
        # native runner; CPython ships ARM64 Windows builds for 3.11+ only.
        # (windows-11-arm は MSVC ARM64 ビルドをネイティブランナーで検証する。
        #  CPython の Windows ARM64 版は 3.11 以降のみ提供)
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # setup-python does not ship CPython 3.9 for the Apple silicon
          # runners; the Linux matrix covers that version.
          # (Apple silicon ランナーには 3.9 が無いため Linux 側で担保する)
          - os: macos-latest
            python-version: "3.9"
        include:
          # The extension is declared free-threading compatible; validate it
          # without the GIL too. cibuildwheel 4.x dropped 3.13t, so only 3.14t.
          # (拡張はフリースレッド対応を宣言しているため GIL 無しでも検証する。
          #  cibuildwheel 4.x が 3.13t を廃止したため 3.14t のみ)
          - os: ubuntu-latest
            python-version: "3.14t"
          - os: macos-latest
            python-version: "3.14t"
          # One job per extra platform is enough to validate the toolchain:
          # MSVC ARM64 compilation is the risk, not the Python version.
          # (追加プラットフォームは 1 ジョブで十分。検証対象は Python の
          #  バージョンではなく MSVC ARM64 コンパイルそのもの)
          - os: windows-11-arm
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        shell: bash
        run: |
          python -m pip install --upgrade build pip pytest
          python -m build

      - name: Install wheel and test
        shell: bash
        run: |
          python -m pip install dist/*.whl
          pytest

      - name: Check that __version__ matches pycedar/VERSION
        shell: bash
        run: |
          set -eu
          reported="$(cd "${RUNNER_TEMP}" && python -c 'import pycedar; print(pycedar.__version__)')"
          expected="$(cat pycedar/VERSION)"
          echo "reported=${reported} expected=${expected}"
          test "${reported}" = "${expected}"

      - name: Install source distribution
        shell: bash
        run: |
          set -eu
          python -m venv "${RUNNER_TEMP}/pycedar-sdist"
          # venv layouts differ between platforms (Scripts/python.exe on
          # Windows, bin/python elsewhere).
          # (venv のレイアウトはプラットフォームで異なる)
          if [ "${RUNNER_OS}" = "Windows" ]; then
            py="${RUNNER_TEMP}/pycedar-sdist/Scripts/python.exe"
          else
            py="${RUNNER_TEMP}/pycedar-sdist/bin/python"
          fi
          "${py}" -m pip install dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${py}" -c "import pycedar; assert pycedar.dict() is not None"

  stub-types:
    name: Type-check the stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # The stubs are checked without building the extension: mypy resolves
      # the module through the PEP 561 stub-only package (pycedar-stubs/).
      # (拡張をビルドせずにスタブを検査する。mypy は PEP 561 の
      #  stub-only パッケージ (pycedar-stubs/) 経由でモジュールを解決する)
      - name: Run mypy on the type-level sample
        run: |
          python -m pip install mypy
          MYPYPATH=. mypy tests/stub_typecheck.py
