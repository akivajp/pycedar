name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # setup-python does not ship CPython 3.9 for the Apple silicon
          # runners; the Linux matrix covers that version.
          # (Apple silicon ランナーには 3.9 が無いため Linux 側で担保する)
          - os: macos-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        run: |
          python -m pip install --upgrade build pip pytest
          python -m build

      - name: Install wheel and test
        run: |
          python -m pip install dist/*.whl
          pytest

      - name: Check that __version__ matches pycedar/VERSION
        run: |
          set -eu
          reported="$(cd "${RUNNER_TEMP}" && python -c 'import pycedar; print(pycedar.__version__)')"
          expected="$(cat pycedar/VERSION)"
          echo "reported=${reported} expected=${expected}"
          test "${reported}" = "${expected}"

      - name: Install source distribution
        run: |
          set -eu
          python -m venv "${RUNNER_TEMP}/pycedar-sdist"
          "${RUNNER_TEMP}/pycedar-sdist/bin/python" -m pip install dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/pycedar-sdist/bin/python" -c "import pycedar; assert pycedar.dict() is not None"
