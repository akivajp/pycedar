[build-system]
requires = [
    "Cython>=3.1,<4",
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Only the interpreters that the test matrix actually covers, including the
# free-threaded build of Python 3.14 (cp314t-*): the extension is declared
# free-threading compatible (see setup.py) and cibuildwheel runs the test
# suite on every wheel it builds, so the 3.14t wheel is validated without the
# GIL. Python 3.13t is not in the list because cibuildwheel 4.x dropped it
# (its ABI was experimental and changed again in 3.14).
# (テストマトリクスが実際にカバーするインタプリタのみ。Python 3.14 の
#  フリースレッド版 (cp314t-*) を含む。モジュールはフリースレッド対応を宣言し
#  (setup.py 参照)、cibuildwheel は各 wheel でテストを実行するため 3.14t は
#  GIL 無しで検証される。3.13t は cibuildwheel 4.x が対応廃止したため対象外)
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
build-frontend = "build"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
# Cross-compile the Intel wheels from the Apple silicon runner.
# cibuildwheel skips the test step for wheels it cannot run natively.
# (arm64ランナーからx86_64をクロスビルドする。実行できないwheelのテストは自動でスキップされる)
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
# The x86_64 build only; the test matrix covers it and an ARM64 Windows
# runner would add a cross-compile setup for little demand.
# (x86_64 のみ。ARM64 Windows ランナーでのクロスビルド設定は需要が見えてから)
archs = ["AMD64"]
